[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "iris-qwen3-reproduction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch==2.9.1", "torchvision==0.24.1", "transformers==4.57.6", "accelerate>=1.0", "numpy", "pillow", "qwen-vl-utils[decord]==0.0.14"]
[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools.packages.find]
include = ["iris*"]
[tool.pytest.ini_options]
testpaths = ["tests/iris"]
